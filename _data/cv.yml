    Skills:
      - label: Laboratory Techniques
        details: "Precise scattering experiments with matter-waves (4He, D2) under high vacuum (10^-6 to 10^-12 mbar); vacuum systems (diffusion, rotary, NEG, and turbo pumps); operation and troubleshooting of nanosecond IR (Nd:YAG: Surelite, Powerlite) and visible dye (Sirah) lasers; Time-of-Flight (TOF) mass spectrometry, Velocity Map Ion Imaging (VMI), Resonance Enhanced Multiphoton Ionization (REMPI); Atomic Force Microscopy (Dimension ICON, NX10)"
      - label: Computational Skills
        details: "Molecular trajectory calculations with the Monte-Carlo method, solving the Schrödinger equation; experimental automation using LabVIEW; converted and upgraded simulations between C, Python, Mathematica, C++, Matlab, and LabVIEW"
      - label: Computer Programs
        details: "C++, Matlab, LabVIEW, LaTeX, Origin, Adobe Illustrator"
      - label: Research Skills
        details: "Experimental design and execution, data analysis and interpretation, technical/procedure documentation, scientific writing and presentation"
      - label: Languages
        details: "Korean (native), English (upper intermediate), German (intermediate, B1 TELC certificate)"
      - label: Leadership
        details: "Student representative, Department of Electrical and Electronic Engineering, UNIST (2012) -- liaison between students and faculty, organizing departmental meetings and student activities"

