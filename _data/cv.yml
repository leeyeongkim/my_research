  sections:
    Research Interests:
      - bullet: My PhD thesis focuses on matter-wave scattering (4He and D2) with thermal-energy atoms incident on surfaces at extremely small incidence angles. This approach enables the study of the atom-surface dispersion potential by accessing a kinetic-energy range of 2-100 neV. We demonstrated fundamental optical principles -- Babinet's principle and the reciprocity theorem -- in the context of matter waves, and discovered a new non-destructive reflection mechanism, multiple edge-diffraction reflection.
      - bullet: In addition, I actively contributed to molecular deflection experiments using a counter-propagating, non-resonant laser pulse and a pulsed molecular beam. The deflected molecules were ionized and detected using velocity map imaging mass spectrometry. I mainly focused on molecular trajectory simulations, considering the rotational-state-dependent polarization of molecules in laser fields.
      - bullet: Motivated by these experiences, I am interested in quantum optics, quantum phenomena on solid surfaces, dispersive interactions between materials, and AMO physics such as laser cooling, trapping, and precision spectroscopy.

